name: slideup
description: "A professional multi-format media player with advanced features."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  state_notifier: ^1.0.0

  # File Management
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  permission_handler: ^12.0.1

  # Network
  path: ^1.9.1
  mime: ^2.0.0
  device_info_plus: ^11.0.0
  connectivity_plus: ^7.0.0
  http: ^1.6.0
  equatable: ^2.0.7
  dio: ^5.9.0

  # Media Players
  video_player: ^2.10.1
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  flutter_html: ^3.0.0

  # Advanced Video Processing
  ffmpeg_kit_flutter_new: ^4.1.0
  saver_gallery: ^4.0.0
  image: ^4.5.4

  # PDF & Document Handling
  syncfusion_flutter_pdfviewer: ^28.2.7
  syncfusion_flutter_pdf: ^28.2.7
  open_filex: ^4.7.0
  share_plus: ^12.0.1

  # UI Components
  cached_network_image: ^3.4.1
  flutter_slidable: ^4.0.3
  loading_animation_widget: ^1.3.0

  # Video Thumbnail
  # video_thumbnail: ^0.5.6
  flutter_cache_manager: ^3.4.1

  # Security
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  crypto: ^3.0.7

  # Database
  sqflite: ^2.4.2
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.2
  flutter_displaymode: ^0.7.0
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.1
  wakelock_plus: ^1.4.0 

  #icons
  cupertino_icons: ^1.0.8
  ionicons: ^0.2.2
  rename: ^3.1.0

  workmanager: ^0.9.0+3
  flutter_local_notifications: ^19.5.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.5

  disk_space_plus: ^0.2.6
  html: ^0.15.6
  archive: ^4.0.7
  timezone: ^0.10.1

  sherpa_onnx: ^1.12.20
  audio_session: ^0.2.2
  syncfusion_pdfviewer_platform_interface: ^28.2.12
  simple_pip_mode: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: ^3.0.3
  build_runner: ^2.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#333333"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
