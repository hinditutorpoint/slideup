name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Flutter (match your local version)
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      # 3️⃣ Check Flutter installation
      - name: Flutter doctor
        run: flutter doctor -v

      # 4️⃣ Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 5️⃣ Analyze code
      - name: Analyze project
        run: flutter analyze

      # 6️⃣ Run Flutter tests
      - name: Run tests
        run: flutter test
