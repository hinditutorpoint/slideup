name: Flutter Signed APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.10.1
        with:
          flutter-version: "3.13.4"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # Restore keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.keystore

      # Inject Gradle properties (Kotlin DSL compatible)
      - name: Create gradle.properties
        run: |
          cat <<EOF > android/gradle.properties
          MY_KEYSTORE=app/my-release-key.keystore
          MY_STORE_PASSWORD=${{ secrets.MY_STORE_PASSWORD }}
          MY_KEY_ALIAS=${{ secrets.MY_KEY_ALIAS }}
          MY_KEY_PASSWORD=${{ secrets.MY_KEY_PASSWORD }}
          EOF

      # Auto versionCode increment
      - name: Update build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          APP_VERSION=$(echo $VERSION | cut -d'+' -f1)
          sed -i "s/^version:.*/version: $APP_VERSION+$BUILD_NUMBER/" pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      # SIGNED APK
      - name: Build signed APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
