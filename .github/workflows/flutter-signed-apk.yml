name: Flutter CI & Signed APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Flutter (exact revision match)
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      # 3️⃣ Verify Flutter
      - name: Flutter doctor
        run: flutter doctor -v

      # 4️⃣ Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 5️⃣ Analyze code
      - name: Analyze project
        run: flutter analyze

      # 6️⃣ Run tests
      - name: Run Flutter tests
        run: flutter test

      # 7️⃣ Build signed APK (keystore step optional)
      - name: Build signed APK
        run: flutter build apk --release
