name: SlideUp Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for the release (e.g. v1.2.3). Leave empty to use the current pubspec version.'
        required: false
        type: string
        default: ''

concurrency:
  group: slideup-release-${{ github.ref }}
  cancel-in-progress: true

# Required so the default GITHUB_TOKEN can create releases (Resource not
# accessible by integration -> 403 without this).
permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release Compact APKs
    runs-on: ubuntu-latest
    # Heavy native deps (media_kit, ffmpeg_kit, sherpa_onnx) — a fresh runner
    # routinely exceeds 45 min; exit 143 = SIGTERM from the job timeout.
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h

      # Gradle build cache speeds up subsequent runs significantly.
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set Version from Git Tag or Dispatch Input
        run: |
          # Version precedence:
          #   1. workflow_dispatch input version_tag (e.g. v1.2.3)
          #   2. pushed tag (refs/tags/v1.2.3)
          #   3. existing version in pubspec.yaml
          # Only the runner's copy of pubspec.yaml is modified — nothing is
          # committed back to the repo.
          REF=${GITHUB_REF_NAME}
          INPUT_VERSION="${{ github.event.inputs.version_tag }}"
          VER=""
          if [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VER=${INPUT_VERSION#v}
            echo "Using dispatch input versionName: $VER"
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VER=${REF#v}
            echo "Using tag versionName: $VER"
          else
            VER=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml | head -1)
            echo "No vX.Y.Z tag/input — keeping versionName: $VER"
          fi
          BUILD_NUM=${GITHUB_RUN_NUMBER}
          sed -i "s/^version:.*/version: $VER+$BUILD_NUM/" pubspec.yaml
          echo "Updated Version: $(grep '^version:' pubspec.yaml)"

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-warnings

      - name: Configure Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - falling back to a throwaway CI keystore (not for Play Store)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Clean Build Cache
        run: flutter clean

      - name: Build Compact Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slideup-release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          tag_name: ${{ github.event.inputs.version_tag != '' && github.event.inputs.version_tag || github.ref_name }}
          name: SlideUp Release ${{ github.event.inputs.version_tag != '' && github.event.inputs.version_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}