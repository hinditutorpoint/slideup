name: SlideUp Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: slideup-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Release Compact APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧹 Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🚀 Auto-Increment Build Number in pubspec.yaml
        run: |
          VERSION_LINE=$(grep 'version:' pubspec.yaml)
          echo "Current Version: $VERSION_LINE"
          BUILD_NUM=${GITHUB_RUN_NUMBER}
          sed -i "s/version: \([0-9]*\.[0-9]*\.[0-9]*\).*/version: \1+$BUILD_NUM/" pubspec.yaml
          echo "Updated Version: $(grep 'version:' pubspec.yaml)"

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Analysis
        run: flutter analyze --no-fatal-warnings

      - name: 🔑 Configure Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - falling back to a throwaway CI keystore (not for Play Store)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 🧹 Clean Build Cache
        run: flutter clean

      - name: 🔨 Build Compact Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slideup-release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          name: SlideUp Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
