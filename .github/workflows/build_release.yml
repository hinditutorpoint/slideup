name: SlideUp Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for the release (e.g. v1.2.3). Leave empty to use the current pubspec version.'
        required: false
        type: string
        default: ''

concurrency:
  group: slideup-release-${{ github.ref }}
  cancel-in-progress: true

# Required so the default GITHUB_TOKEN can create releases (Resource not
# accessible by integration -> 403 without this).
permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release Compact APKs
    runs-on: ubuntu-latest
    # Heavy native deps (media_kit, ffmpeg_kit, sherpa_onnx) — a fresh runner
    # routinely exceeds 45 min; exit 143 = SIGTERM from the job timeout.
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h

      # Gradle build cache speeds up subsequent runs significantly.
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version, Auto-Increment & Create Tag
        id: versioning
        run: |
          git fetch --tags --force || true

          REF="${GITHUB_REF_NAME}"
          INPUT_VERSION="${{ github.event.inputs.version_tag }}"
          TAG=""

          if [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # 1. Manual workflow_dispatch input
            TAG="${INPUT_VERSION}"
            [[ ! "$TAG" =~ ^v ]] && TAG="v$TAG"
            echo "Using manual dispatch tag: $TAG"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # 2. Triggered by a pushed tag
            TAG="${REF}"
            echo "Using pushed git tag: $TAG"
          else
            # 3. Auto-increment: find latest tag or read pubspec.yaml
            LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
            if [ -n "$LATEST_TAG" ]; then
              echo "Latest git tag found: $LATEST_TAG"
              # Extract major, minor, patch
              CLEAN_TAG="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
              echo "Auto-incremented to next patch tag: $TAG"
            else
              BASE_VER=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml | head -1)
              [ -z "$BASE_VER" ] && BASE_VER="1.0.0"
              TAG="v${BASE_VER}"
              echo "No previous tags found. Starting from pubspec version: $TAG"
            fi
          fi

          # Create and push git tag if it does not already exist and not in PR
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Creating and pushing git tag $TAG..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG"
              git push origin "$TAG" || echo "Tag push skipped or failed"
            else
              echo "Tag $TAG already exists on remote."
            fi
          fi

          VERSION_NAME="${TAG#v}"
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          sed -i "s/^version:.*/version: $VERSION_NAME+$BUILD_NUM/" pubspec.yaml
          echo "Updated pubspec.yaml: $(grep '^version:' pubspec.yaml)"

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-warnings

      - name: Configure Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - falling back to a throwaway CI keystore (not for Play Store)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Clean Build Cache
        run: flutter clean

      - name: Build Compact Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slideup-release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          tag_name: ${{ env.RELEASE_TAG }}
          name: SlideUp Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases (Keep Latest 10)
        if: github.event_name != 'pull_request'
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}